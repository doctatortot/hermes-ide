name: Debug AppImage

# Manual diagnostic workflow.
#
# Why this exists: in v1.1.3 we shipped the Claude Agent SDK runtime as
# a 210MB Tauri resource (`bridge/node_modules`).  linuxdeploy fails to
# bundle that tree into an AppImage on both x86_64 and aarch64, but
# Tauri's bundler swallows linuxdeploy's stderr — the only error we
# see is "failed to run linuxdeploy" with no underlying cause.
#
# This workflow:
#   1. Checks out the current main.
#   2. Stages the bridge runtime (same as a normal release build).
#   3. Runs `tauri build --bundles appimage --verbose` with maximum
#      logging env vars set so linuxdeploy's actual error reaches the
#      job logs.
#
# Use the captured output to decide whether AppImage can be unblocked
# without the architectural fix (ADR 002 — tarball-extract on first
# launch) or whether ADR 002 is required.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to debug (x86_64 or aarch64)"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - aarch64

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Maximum verbosity from Tauri bundler + cargo + AppImage tooling.
  RUST_LOG: "tauri_bundler=trace,info"
  RUST_BACKTRACE: "full"
  # linuxdeploy itself respects DEBUG=1 in its plugin scripts.
  DEBUG: "1"
  # AppImageTool: avoid sandbox issues that fail silently in CI.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  NO_STRIP: "1"

jobs:
  debug:
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Point apt at archive.ubuntu.com directly
        run: |
          set -e
          # The GH-hosted runner's default sources.list uses Azure's regional
          # mirror redirector (mirror+file:/etc/apt/apt-mirrors.txt), which has
          # been serving an index that lists GStreamer package versions its
          # backing pool then 404s on when actually fetched — reproduced twice,
          # hours apart, on two different mirror IPs, always the same exact
          # package/version. Bypassing it for the canonical direct Ubuntu
          # archive (which Canonical publishes both index and pool to in sync)
          # to see if that's a redirector-specific inconsistency.
          if [ "${{ inputs.arch }}" = "aarch64" ]; then
            SUITE="noble"
            MIRROR="http://ports.ubuntu.com/ubuntu-ports"
            SECURITY="http://ports.ubuntu.com/ubuntu-ports"
          else
            SUITE="jammy"
            MIRROR="http://archive.ubuntu.com/ubuntu"
            SECURITY="http://security.ubuntu.com/ubuntu"
          fi
          sudo rm -f /etc/apt/sources.list.d/*.list
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb $MIRROR $SUITE main restricted universe multiverse
          deb $MIRROR $SUITE-updates main restricted universe multiverse
          deb $MIRROR $SUITE-backports main restricted universe multiverse
          deb $SECURITY $SUITE-security main restricted universe multiverse
          EOF
          sudo apt-get update

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libfuse2 file desktop-file-utils
          # Cache key bumped 1.0 -> 1.2 -> 1.3: 1.0 and 1.1 (see prior comment
          # history) both silently cached "0 installed packages" — this action
          # reports success even when apt-get can't fetch every archive in one
          # transaction. 1.2 (tested against the old mirror redirector) hit the
          # exact same silent-empty-cache failure. 1.3 is fresh, paired with
          # the direct-archive switch above.
          version: 1.3

      - name: Install npm deps + stage bridge runtime
        run: npm ci

      - name: Inspect bundle layout (sizes + file count)
        run: |
          echo "=== bridge/node_modules size ==="
          du -sh src-tauri/bridge/node_modules
          echo "=== bridge/node_modules file count ==="
          find src-tauri/bridge/node_modules -type f | wc -l
          echo "=== top-level entries ==="
          ls -la src-tauri/bridge/node_modules/
          echo "=== largest files ==="
          find src-tauri/bridge/node_modules -type f -size +5M -exec ls -lh {} \; | head -20

      - name: Generate ephemeral signing key for this debug run
        run: |
          set -e
          # tauri.conf.json has a real updater pubkey configured, so the
          # bundler insists on a private key to produce a .sig alongside
          # the AppImage even though this debug workflow never publishes
          # anything. A throwaway keypair generated fresh on this runner
          # satisfies that check — the .sig it produces won't verify
          # against the app's real pubkey, which is fine since nothing
          # here is ever published or checked against it.
          npx tauri signer generate --ci -w /tmp/debug-signing.key -p ""
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<TAURI_KEY_EOF"
            cat /tmp/debug-signing.key
            echo "TAURI_KEY_EOF"
          } >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Build AppImage with maximum verbosity
        run: |
          set -x -o pipefail
          # The verbose flag on tauri-cli reveals which subcommands are
          # being invoked.  Combined with RUST_LOG=trace, we should see
          # linuxdeploy's argv and any stderr it produces.
          #
          # pipefail matters here: without it, this step's exit code is
          # `tee`'s (always 0), so a real `tauri build` failure (e.g. a
          # tauri/@tauri-apps version mismatch aborting before the bundler
          # even runs) is invisible to `steps.*.outcome` even though
          # continue-on-error already keeps the job itself green.
          TARGET="${{ inputs.arch == 'aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}"
          npx tauri build --target "$TARGET" --bundles appimage --verbose 2>&1 | tee /tmp/appimage-build.log
        continue-on-error: true

      - name: Hunt for linuxdeploy logs
        if: always()
        run: |
          set +e
          echo "=== /tmp/*.log ==="
          ls -la /tmp/*.log 2>/dev/null || true
          echo
          echo "=== linuxdeploy under cargo cache ==="
          find ~/.cargo -path "*linuxdeploy*" 2>/dev/null | head -20
          echo
          echo "=== AppDir created? ==="
          find src-tauri/target -path "*appimage*" -type d 2>/dev/null
          echo
          echo "=== AppDir tail of any run log ==="
          find src-tauri/target -path "*appimage*" -name "*.log" -exec echo "----- {} -----" \; -exec cat {} \;
          true

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appimage-debug-${{ inputs.arch }}
          path: |
            /tmp/appimage-build.log
            src-tauri/target/**/appimage/**
          retention-days: 14
          if-no-files-found: warn
